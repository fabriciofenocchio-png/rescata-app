<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rescatá — Misiones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #12261b; --bg-elevated: #1a3626; --surface: #1f402c; --paper: #f3ecda;
    --tierra: #b6401d; --tierra-bright: #d9531f; --yerba: #7fa25a; --gold: #cf9a35;
    --text-light: #f3ecda; --text-muted: #a9c0a5; --line: rgba(243,236,218,0.14);
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text-light); font-family:'Manrope',sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:900px; margin:0 auto; padding:28px 20px 60px; }
  h1,h2,h3 { font-family:'Fraunces',serif; font-weight:500; margin:0; }
  .brand { font-size:30px; letter-spacing:-0.01em; }
  .brand span { color:var(--tierra-bright); }
  .tagline { color:var(--text-muted); font-size:14px; margin:2px 0 22px; }
  .tabs { display:flex; gap:6px; margin-bottom:22px; border-bottom:1px solid var(--line); }
  .tab { background:none; border:none; color:var(--text-muted); font-family:'Manrope',sans-serif; font-size:14px; font-weight:600; padding:10px 4px; cursor:pointer; border-bottom:2px solid transparent; margin-right:18px; }
  .tab.active { color:var(--text-light); border-bottom-color:var(--tierra-bright); }
  .view { display:none; } .view.active { display:block; }
  .empty { border:1px dashed var(--line); border-radius:14px; padding:36px 24px; text-align:center; color:var(--text-muted); }
  .empty h3 { color:var(--text-light); margin-bottom:8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px; }
  .card { background:var(--surface); border-radius:14px; padding:18px; border:1px solid var(--line); display:flex; flex-direction:column; gap:10px; }
  .badge { display:inline-block; background:var(--bg-elevated); color:var(--yerba); font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; padding:4px 9px; border-radius:100px; width:fit-content; }
  .card h3 { font-size:18px; line-height:1.25; }
  .card .comercio { color:var(--text-muted); font-size:13px; margin-top:-6px; }
  .price-row { display:flex; align-items:baseline; gap:8px; margin-top:2px; }
  .price-orig { color:var(--text-muted); text-decoration:line-through; font-size:14px; }
  .price-final { color:var(--gold); font-size:22px; font-weight:600; font-family:'IBM Plex Mono',monospace; }
  .meta-row { display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-muted); border-top:1px solid var(--line); padding-top:10px; }
  .btn { background:var(--tierra); color:var(--paper); border:none; border-radius:10px; padding:11px 14px; font-family:'Manrope',sans-serif; font-weight:700; font-size:14px; cursor:pointer; margin-top:4px; }
  .btn:hover { background:var(--tierra-bright); } .btn:disabled { background:var(--bg-elevated); color:var(--text-muted); cursor:not-allowed; }
  .btn.secondary { background:var(--bg-elevated); color:var(--text-light); } .btn.secondary:hover { background:var(--surface); }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:20px; }
  .panel h3 { font-size:15px; margin-bottom:14px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.04em; font-family:'Manrope',sans-serif; font-weight:700; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .form-grid label { grid-column:span 2; font-size:13px; color:var(--text-muted); display:flex; flex-direction:column; gap:5px; }
  .form-grid label.half { grid-column:span 1; }
  input,select,textarea { background:var(--bg-elevated); border:1px solid var(--line); border-radius:8px; padding:9px 11px; color:var(--text-light); font-family:'Manrope',sans-serif; font-size:14px; }
  input:focus,select:focus,textarea:focus { outline:2px solid var(--tierra-bright); }
  .notice { border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:14px; }
  .notice.warn { background:rgba(207,154,53,0.15); color:var(--gold); border:1px solid rgba(207,154,53,0.3); }
  .notice.ok { background:rgba(127,162,90,0.15); color:var(--yerba); border:1px solid rgba(127,162,90,0.3); }
  .bolsa-row { display:flex; justify-content:space-between; align-items:center; font-size:13px; background:var(--bg-elevated); border-radius:8px; padding:8px 12px; margin-top:6px; }
  .top-account { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--text-muted); margin-bottom:14px; }
  .link-btn { background:none; border:none; color:var(--tierra-bright); font-weight:700; font-size:13px; cursor:pointer; padding:4px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="brand">Rescat<span>á</span></h1>
  <p class="tagline">La comida que sobra en Posadas, a mitad de precio.</p>

  <div class="tabs">
    <button class="tab active" data-tab="explorar">Explorar</button>
    <button class="tab" data-tab="admin">Panel de comercio</button>
  </div>

  <div class="view active" id="view-explorar">
    <div id="explorar-content">Cargando...</div>
  </div>

  <div class="view" id="view-admin">
    <div id="admin-content"></div>
  </div>
</div>

<script>
// ⚠️ Reemplazá estos dos valores por los de TU proyecto de Supabase
// (Settings → API → Project URL / anon public key)
const SUPABASE_URL = 'https://hnekoxuytikioamoubhc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhuZWtveHV5dGlraW9hbW91YmhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzMxODEsImV4cCI6MjEwMjc0OTE4MX0.uyGJ2jQHA-6TDjOqFIh-v4XeDSaFGq2s_9YSGNw8onw';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- EXPLORAR (público) ----------
async function renderExplorar() {
  const el = document.getElementById('explorar-content');
  const { data: bolsas, error } = await sb
    .from('bolsas')
    .select('*, comercios(nombre, categoria, barrio)')
    .eq('activa', true)
    .gt('cantidad', 0);

  if (error || !bolsas || bolsas.length === 0) {
    el.innerHTML = `<div class="empty"><h3>Todavía no hay bolsas disponibles</h3><p>Volvé a mirar más tarde o sumate como comercio desde la otra pestaña.</p></div>`;
    return;
  }

  el.innerHTML = `<div class="grid">${bolsas.map(b => `
    <div class="card">
      <span class="badge">${b.comercios.categoria}</span>
      <h3>${b.descripcion}</h3>
      <div class="comercio">${b.comercios.nombre} · ${b.comercios.barrio}</div>
      <div class="price-row">
        <span class="price-orig">$${b.precio_original}</span>
        <span class="price-final">$${b.precio_descuento}</span>
      </div>
      <div class="meta-row"><span>Retiro: ${b.horario}</span><span>${b.cantidad} quedan</span></div>
      <button class="btn" onclick="reservar('${b.id}', this)">Reservar</button>
    </div>
  `).join('')}</div>`;
}

async function reservar(bolsaId, btn) {
  btn.disabled = true;
  btn.textContent = 'Redirigiendo a Mercado Pago...';
  try {
    const res = await fetch('/api/create-preference', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bolsaId }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error al iniciar el pago');
    window.location.href = data.init_point;
  } catch (e) {
    alert(e.message);
    btn.disabled = false;
    btn.textContent = 'Reservar';
  }
}

// ---------- PANEL DE COMERCIO ----------
async function renderAdmin() {
  const el = document.getElementById('admin-content');
  const { data: { session } } = await sb.auth.getSession();

  if (!session) {
    el.innerHTML = `
      <div class="panel">
        <h3>Ingresar / Crear cuenta de comercio</h3>
        <form class="form-grid" id="form-login">
          <label>Email <input type="email" id="l-email" required></label>
          <label>Contraseña <input type="password" id="l-pass" required></label>
          <button type="submit" class="btn">Ingresar</button>
        </form>
      </div>
      <div class="panel">
        <h3>Todavía no tenés cuenta</h3>
        <form class="form-grid" id="form-signup">
          <label>Nombre del comercio <input type="text" id="s-nombre" required></label>
          <label class="half">Categoría
            <select id="s-categoria"><option>Panadería</option><option>Restaurante</option><option>Verdulería</option><option>Supermercado</option><option>Rotisería</option><option>Otro</option></select>
          </label>
          <label class="half">Barrio <input type="text" id="s-barrio" required></label>
          <label>Dirección <input type="text" id="s-direccion" required></label>
          <label>Email <input type="email" id="s-email" required></label>
          <label>Contraseña <input type="password" id="s-pass" required minlength="6"></label>
          <button type="submit" class="btn secondary" style="grid-column:span 2;">Crear cuenta de comercio</button>
        </form>
      </div>
    `;

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { error } = await sb.auth.signInWithPassword({
        email: document.getElementById('l-email').value,
        password: document.getElementById('l-pass').value,
      });
      if (error) return alert(error.message);
      renderAdmin();
    });

    document.getElementById('form-signup').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('s-email').value;
      const password = document.getElementById('s-pass').value;
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) return alert(error.message);
      if (!data.session) {
        return alert('Cuenta creada. Revisá tu email para confirmar antes de ingresar.');
      }
      await sb.from('comercios').insert({
        id: data.user.id,
        nombre: document.getElementById('s-nombre').value,
        categoria: document.getElementById('s-categoria').value,
        barrio: document.getElementById('s-barrio').value,
        direccion: document.getElementById('s-direccion').value,
      });
      renderAdmin();
    });
    return;
  }

  // Con sesión: traemos el perfil del comercio + sus bolsas
  const { data: comercio } = await sb.from('comercios').select('*').eq('id', session.user.id).single();
  const { data: bolsas } = await sb.from('bolsas').select('*').eq('comercio_id', session.user.id).order('created_at', { ascending: false });

  el.innerHTML = `
    <div class="top-account">
      <span>Conectado como <strong>${comercio?.nombre || session.user.email}</strong></span>
      <button class="link-btn" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>

    ${!comercio?.mp_access_token ? `
      <div class="notice warn">
        Todavía no vinculaste tu cuenta de Mercado Pago — sin esto no podés cobrar.
        <a href="/api/mp-oauth-start?comercioId=${session.user.id}" style="color:var(--gold); font-weight:700;">Conectar ahora →</a>
      </div>
    ` : `<div class="notice ok">Cuenta de Mercado Pago vinculada ✓</div>`}

    <div class="panel">
      <h3>Cargar nueva bolsa sorpresa</h3>
      <form class="form-grid" id="form-bolsa">
        <label>Descripción <input type="text" id="b-desc" placeholder="Bolsa de facturas y pan del día" required></label>
        <label class="half">Precio original ($) <input type="number" id="b-orig" min="1" required></label>
        <label class="half">Precio con descuento ($) <input type="number" id="b-desc-precio" min="1" required></label>
        <label class="half">Cantidad <input type="number" id="b-cant" min="1" required></label>
        <label class="half">Horario de retiro <input type="text" id="b-horario" placeholder="19:30 a 20:30" required></label>
        <button type="submit" class="btn" style="grid-column:span 2;">Cargar bolsa</button>
      </form>
    </div>

    <div class="panel">
      <h3>Mis bolsas</h3>
      ${(bolsas || []).map(b => `
        <div class="bolsa-row">
          <span>${b.descripcion}</span>
          <span>$${b.precio_original} → $${b.precio_descuento} · ${b.cantidad} disp.</span>
        </div>
      `).join('') || '<p style="color:var(--text-muted); font-size:13px;">Todavía no cargaste ninguna.</p>'}
    </div>
  `;

  document.getElementById('form-bolsa').addEventListener('submit', async (e) => {
    e.preventDefault();
    await sb.from('bolsas').insert({
      comercio_id: session.user.id,
      descripcion: document.getElementById('b-desc').value,
      precio_original: Number(document.getElementById('b-orig').value),
      precio_descuento: Number(document.getElementById('b-desc-precio').value),
      cantidad: Number(document.getElementById('b-cant').value),
      horario: document.getElementById('b-horario').value,
    });
    renderAdmin();
  });
}

async function cerrarSesion() {
  await sb.auth.signOut();
  renderAdmin();
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'admin') renderAdmin();
  });
});

renderExplorar();

if (location.search.includes('mp=conectado')) {
  document.querySelector('[data-tab="admin"]').click();
}
</script>
</body>
</html>
