<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rescatá — Misiones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12261b;
    --bg-elevated: #1a3626;
    --surface: #1f402c;
    --paper: #f3ecda;
    --tierra: #b6401d;
    --tierra-bright: #d9531f;
    --yerba: #7fa25a;
    --gold: #cf9a35;
    --text-light: #f3ecda;
    --text-muted: #a9c0a5;
    --line: rgba(243,236,218,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-light);
    font-family: 'Manrope', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 20px 60px; }
  h1, h2, h3 { font-family: 'Fraunces', serif; font-weight: 500; margin: 0; }
  .brand-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .brand { font-size: 30px; letter-spacing: -0.01em; }
  .brand span { color: var(--tierra-bright); }
  .tagline { color: var(--text-muted); font-size: 14px; margin: 2px 0 22px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
  .tab {
    background: none; border: none; color: var(--text-muted); font-family: 'Manrope', sans-serif;
    font-size: 14px; font-weight: 600; padding: 10px 4px; cursor: pointer; border-bottom: 2px solid transparent;
    margin-right: 18px;
  }
  .tab.active { color: var(--text-light); border-bottom-color: var(--tierra-bright); }
  .view { display: none; }
  .view.active { display: block; }

  .empty {
    border: 1px dashed var(--line); border-radius: 14px; padding: 36px 24px; text-align: center; color: var(--text-muted);
  }
  .empty h3 { color: var(--text-light); margin-bottom: 8px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }

  .card {
    background: var(--surface); border-radius: 14px; padding: 18px; border: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 10px;
  }
  .badge {
    display: inline-block; background: var(--bg-elevated); color: var(--yerba); font-size: 11px; font-weight: 700;
    letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 9px; border-radius: 100px; width: fit-content;
  }
  .card h3 { font-size: 18px; line-height: 1.25; }
  .card .comercio { color: var(--text-muted); font-size: 13px; margin-top: -6px; }
  .card .desc { font-size: 14px; color: var(--text-light); line-height: 1.5; }
  .price-row { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
  .price-orig { color: var(--text-muted); text-decoration: line-through; font-size: 14px; }
  .price-final { color: var(--gold); font-size: 22px; font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
  .meta-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-muted); border-top: 1px solid var(--line); padding-top: 10px; }
  .qty { display: flex; gap: 3px; align-items: center; }
  .leaf { width: 8px; height: 8px; border-radius: 2px 8px; background: var(--yerba); display: inline-block; }
  .leaf.off { background: rgba(255,255,255,0.1); }
  .btn {
    background: var(--tierra); color: var(--paper); border: none; border-radius: 10px; padding: 11px 14px;
    font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 4px;
  }
  .btn:hover { background: var(--tierra-bright); }
  .btn:disabled { background: var(--bg-elevated); color: var(--text-muted); cursor: not-allowed; }
  .btn.secondary { background: var(--bg-elevated); color: var(--text-light); }
  .btn.secondary:hover { background: var(--surface); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
  .panel h3 { font-size: 15px; margin-bottom: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; font-family: 'Manrope',sans-serif; font-weight: 700; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-grid label { grid-column: span 2; font-size: 13px; color: var(--text-muted); display: flex; flex-direction: column; gap: 5px; }
  .form-grid label.half { grid-column: span 1; }
  input, select, textarea {
    background: var(--bg-elevated); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
    color: var(--text-light); font-family: 'Manrope', sans-serif; font-size: 14px;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--tierra-bright); }
  textarea { resize: vertical; min-height: 50px; }

  .comercio-block { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
  .comercio-block:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  .comercio-head { display: flex; justify-content: space-between; align-items: center; }
  .comercio-head h4 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 16px; margin: 0; }
  .comercio-head .cat { color: var(--text-muted); font-size: 12.5px; }
  .bolsa-list { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .bolsa-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; background: var(--bg-elevated); border-radius: 8px; padding: 8px 12px; }
  .bolsa-row .r { color: var(--text-muted); display: flex; gap: 10px; align-items: center; }
  .link-btn { background: none; border: none; color: var(--tierra-bright); font-weight: 700; font-size: 13px; cursor: pointer; padding: 4px 0; }

  .modal-overlay { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: rgba(0,0,0,0.6); position: fixed; inset: 0; z-index: 10; padding: 20px; }
  .modal { background: var(--paper); color: #1a1a14; border-radius: 16px; padding: 28px; max-width: 360px; width: 100%; text-align: center; }
  .stamp {
    width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--tierra); color: var(--tierra);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-family: 'Fraunces', serif;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; line-height: 1.3;
    transform: rotate(-6deg);
  }
  .code { font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 500; letter-spacing: 0.06em; margin: 6px 0 4px; }
  .modal p.small { color: #55554a; font-size: 13px; margin: 4px 0 18px; }
  .modal .btn { width: 100%; }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand-row">
    <h1 class="brand">Rescat<span>á</span></h1>
  </div>
  <p class="tagline">La comida que sobra en Posadas, a mitad de precio.</p>

  <div class="tabs">
    <button class="tab active" data-tab="explorar">Explorar</button>
    <button class="tab" data-tab="admin">Sumar comercio</button>
  </div>

  <div class="view active" id="view-explorar">
    <div id="explorar-content"></div>
  </div>

  <div class="view" id="view-admin">
    <div class="panel">
      <h3>Nuevo comercio adherido</h3>
      <form class="form-grid" id="form-comercio">
        <label>Nombre del comercio
          <input type="text" id="c-nombre" placeholder="Panadería del Puerto" required>
        </label>
        <label class="half">Categoría
          <select id="c-categoria">
            <option>Panadería</option>
            <option>Restaurante</option>
            <option>Verdulería</option>
            <option>Supermercado</option>
            <option>Rotisería</option>
            <option>Otro</option>
          </select>
        </label>
        <label class="half">Barrio
          <input type="text" id="c-barrio" placeholder="Villa Cabello" required>
        </label>
        <label>Dirección
          <input type="text" id="c-direccion" placeholder="Av. Costanera 1234" required>
        </label>
        <button type="submit" class="btn" style="grid-column: span 2;">Agregar comercio</button>
      </form>
    </div>

    <div class="panel">
      <h3>Comercios y bolsas sorpresa</h3>
      <div id="admin-list"></div>
    </div>
  </div>

</div>

<div id="modal-root"></div>

<script>
let data = { comercios: [], bolsas: [] };

async function loadData() {
  try {
    const res = await window.storage.get('rescata-data', true);
    if (res && res.value) data = JSON.parse(res.value);
  } catch (e) {
    data = { comercios: [], bolsas: [] };
  }
  render();
}

async function saveData() {
  try {
    await window.storage.set('rescata-data', JSON.stringify(data), true);
  } catch (e) {
    console.error('No se pudo guardar', e);
  }
}

function uid() { return Math.random().toString(36).slice(2, 9); }

function comercioById(id) { return data.comercios.find(c => c.id === id); }

function render() {
  renderExplorar();
  renderAdmin();
}

function renderExplorar() {
  const el = document.getElementById('explorar-content');
  const activas = data.bolsas.filter(b => b.cantidad > 0);
  if (activas.length === 0) {
    el.innerHTML = `<div class="empty"><h3>Todavía no hay bolsas disponibles</h3><p>Sumá un comercio y cargá su primera bolsa sorpresa desde la pestaña "Sumar comercio".</p></div>`;
    return;
  }
  el.innerHTML = `<div class="grid">${activas.map(b => {
    const c = comercioById(b.comercioId);
    if (!c) return '';
    const leaves = Array.from({length: 5}, (_, i) => `<span class="leaf ${i < Math.min(b.cantidad,5) ? '' : 'off'}"></span>`).join('');
    return `
      <div class="card">
        <span class="badge">${c.categoria}</span>
        <h3>${b.descripcion}</h3>
        <div class="comercio">${c.nombre} · ${c.barrio}</div>
        <div class="price-row">
          <span class="price-orig">$${b.precioOriginal}</span>
          <span class="price-final">$${b.precioDescuento}</span>
        </div>
        <div class="meta-row">
          <span>Retiro: ${b.horario}</span>
          <span class="qty">${leaves} ${b.cantidad} qued.</span>
        </div>
        <button class="btn" onclick="reservar('${b.id}')">Reservar</button>
      </div>
    `;
  }).join('')}</div>`;
}

function renderAdmin() {
  const el = document.getElementById('admin-list');
  if (data.comercios.length === 0) {
    el.innerHTML = `<p style="color:var(--text-muted); font-size:14px;">Todavía no cargaste ningún comercio.</p>`;
    return;
  }
  el.innerHTML = data.comercios.map(c => {
    const bolsas = data.bolsas.filter(b => b.comercioId === c.id);
    return `
      <div class="comercio-block">
        <div class="comercio-head">
          <div>
            <h4>${c.nombre}</h4>
            <div class="cat">${c.categoria} · ${c.barrio}</div>
          </div>
          <button class="link-btn" onclick="toggleForm('${c.id}')">+ bolsa sorpresa</button>
        </div>
        <div class="bolsa-list">
          ${bolsas.map(b => `
            <div class="bolsa-row">
              <span>${b.descripcion}</span>
              <span class="r"><span>$${b.precioOriginal} → $${b.precioDescuento}</span><span>${b.cantidad} disp.</span></span>
            </div>
          `).join('') || '<span style="color:var(--text-muted); font-size:13px;">Sin bolsas cargadas.</span>'}
        </div>
        <div id="form-bolsa-${c.id}" style="display:none; margin-top:12px;">
          <form class="form-grid" onsubmit="addBolsa(event, '${c.id}')">
            <label>Descripción de la bolsa
              <input type="text" placeholder="Bolsa de facturas y pan del día" required class="b-desc">
            </label>
            <label class="half">Precio original ($)
              <input type="number" min="1" required class="b-precio-orig">
            </label>
            <label class="half">Precio con descuento ($)
              <input type="number" min="1" required class="b-precio-desc">
            </label>
            <label class="half">Cantidad de bolsas
              <input type="number" min="1" required class="b-cantidad">
            </label>
            <label class="half">Horario de retiro
              <input type="text" placeholder="19:30 a 20:30" required class="b-horario">
            </label>
            <button type="submit" class="btn" style="grid-column: span 2;">Cargar bolsa</button>
          </form>
        </div>
      </div>
    `;
  }).join('');
}

function toggleForm(comercioId) {
  const f = document.getElementById('form-bolsa-' + comercioId);
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
}

document.getElementById('form-comercio').addEventListener('submit', async (e) => {
  e.preventDefault();
  const nombre = document.getElementById('c-nombre').value.trim();
  const categoria = document.getElementById('c-categoria').value;
  const barrio = document.getElementById('c-barrio').value.trim();
  const direccion = document.getElementById('c-direccion').value.trim();
  data.comercios.push({ id: uid(), nombre, categoria, barrio, direccion });
  await saveData();
  e.target.reset();
  render();
});

async function addBolsa(e, comercioId) {
  e.preventDefault();
  const form = e.target;
  const descripcion = form.querySelector('.b-desc').value.trim();
  const precioOriginal = Number(form.querySelector('.b-precio-orig').value);
  const precioDescuento = Number(form.querySelector('.b-precio-desc').value);
  const cantidad = Number(form.querySelector('.b-cantidad').value);
  const horario = form.querySelector('.b-horario').value.trim();
  data.bolsas.push({ id: uid(), comercioId, descripcion, precioOriginal, precioDescuento, cantidad, horario });
  await saveData();
  render();
  toggleForm(comercioId);
}

async function reservar(bolsaId) {
  const bolsa = data.bolsas.find(b => b.id === bolsaId);
  if (!bolsa || bolsa.cantidad <= 0) return;
  bolsa.cantidad -= 1;
  await saveData();
  render();
  const code = Math.random().toString(36).slice(2, 6).toUpperCase();
  const c = comercioById(bolsa.comercioId);
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) this.remove()">
      <div class="modal">
        <div class="stamp">Rescatado<br>en Posadas</div>
        <p class="small">Mostrá este código al retirar en</p>
        <div class="code">${code}</div>
        <p class="small">${c.nombre} · ${bolsa.horario}</p>
        <button class="btn" onclick="this.closest('.modal-overlay').remove()">Listo</button>
      </div>
    </div>
  `;
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.tab).classList.add('active');
  });
});

loadData();
</script>
</body>
</html>
